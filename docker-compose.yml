services:
  postgres:
    image: postgres:16-alpine
    container_name: nuncajamas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: lostboy
      POSTGRES_PASSWORD: neverland_secret_2026
      POSTGRES_DB: nuncajamas_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostboy -d nuncajamas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - neverland_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nuncajamas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://lostboy:neverland_secret_2026@postgres:5432/nuncajamas_db?schema=public"
      PORT: 4000
      FRONTEND_URL: "http://localhost:3010"
    ports:
      - "4000:4000"
    command: >
      sh -c "npx prisma db push &&
             npx prisma db seed &&
             node dist/index.js"
    networks:
      - neverland_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nuncajamas_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
      INTERNAL_API_URL: "http://backend:4000"
    ports:
      - "3010:3000"
    networks:
      - neverland_net

volumes:
  pgdata:

networks:
  neverland_net:
    driver: bridge
